name: Tests

on:
  push:
    paths: ["dealsniper/**", "tests/**", "config.example.yaml", "requirements.txt", "pyproject.toml"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check dealsniper tests
      - run: python -m pytest -q

# Exécution automatique de Deal Sniper sur GitHub Actions.
# Les fichiers data/*.json (annonces vues, historique) sont recommités après
# chaque passage pour que l'état persiste d'une exécution à l'autre.
name: Deal Sniper

on:
  schedule:
    # Toutes les heures à hh:17, de 6h à 23h (heure de Paris en hiver = UTC+1).
    # ~18 passages/jour ≈ 550 min/mois : sous le quota gratuit de 2000 min des dépôts privés.
    - cron: "17 5-22 * * *"
  workflow_dispatch: {}          # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: write                # nécessaire pour recommiter data/

concurrency:
  group: dealsniper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer Deal Sniper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IMAP_SERVER: ${{ secrets.IMAP_SERVER }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_EMAIL: ${{ secrets.IMAP_EMAIL }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Sauvegarder l'état (data/)
        if: always()
        run: |
          git config user.name  "dealsniper-bot"
          git config user.email "dealsniper-bot@users.noreply.github.com"
          git add data/seen_ads.json data/deals.json data/runs.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "chore(data): mise à jour de l'état [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi

# Deal Sniper sur GitHub Actions (sans serveur).
#  * planifié : un passage toutes les 30 min de 6 h à 23 h (heure de Paris en hiver) ;
#  * manuel : Actions > Deal Sniper > Run workflow, en choisissant le mode.
# La base SQLite (annonces déjà vues) est conservée d'un passage à l'autre dans le cache GitHub.
# Si Deal Sniper tourne en continu sur un Raspberry Pi (`watch`), supprimez le bloc `schedule`.
name: Deal Sniper

on:
  schedule:
    - cron: "7,37 5-22 * * *"   # GitHub peut retarder ou sauter des passages aux heures chargées
  workflow_dispatch:
    inputs:
      mode:
        description: "Que faire ?"
        type: choice
        default: run
        options: [run, test-notif, recap]

permissions:
  contents: read

concurrency:
  group: dealsniper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Sur GitHub Actions seul eBay est utilisable (API officielle) : sans sa clé, un passage planifié
      # ne ferait rien. On s'arrête alors tout de suite (test-notif et recap restent possibles).
      - name: Clé eBay présente ?
        id: gate
        env:
          HAS_EBAY: ${{ secrets.EBAY_CLIENT_ID != '' && secrets.EBAY_CLIENT_SECRET != '' }}
          MODE: ${{ inputs.mode || 'run' }}
        run: |
          if [ "$HAS_EBAY" = "true" ] || [ "$MODE" != "run" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pas de clé eBay (secrets EBAY_CLIENT_ID / EBAY_CLIENT_SECRET) : passage ignoré."
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.go == 'true'

      - name: Restaurer la base (annonces déjà vues)
        if: steps.gate.outputs.go == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/dealsniper.db
          key: dealsniper-db-${{ github.run_id }}
          restore-keys: dealsniper-db-

      - name: Deal Sniper (${{ inputs.mode || 'run' }})
        if: steps.gate.outputs.go == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        # eBay seul : les autres sites passent par un navigateur, indisponible ici.
        run: python -m dealsniper --sites ebay ${{ inputs.mode || 'run' }}

      - name: Sauvegarder la base
        if: always() && steps.gate.outputs.go == 'true' && (inputs.mode || 'run') == 'run'
        uses: actions/cache/save@v4
        with:
          path: data/dealsniper.db
          key: dealsniper-db-${{ github.run_id }}

# Exécution automatique de Deal Sniper sur GitHub Actions.
#  * planifié : toutes les heures de 6 h à 23 h (heure de Paris en hiver, UTC+1) ;
#  * manuel : onglet Actions > Deal Sniper > Run workflow, en choisissant le mode.
# Après un passage « run », data/*.json est recommité pour mémoriser l'état.
name: Deal Sniper

on:
  schedule:
    - cron: "17 5-22 * * *"   # GitHub peut retarder ou sauter des passages planifiés
  workflow_dispatch:
    inputs:
      mode:
        description: "Que faire ?"
        type: choice
        default: run
        options:
          - run              # passage complet (IA + notifications)
          - dry-run          # collecte + filtre, sans IA ni sauvegarde
          - inspect-emails   # diagnostic : annonces extraites de chaque email
          - test-notif       # fausse annonce envoyée sur Telegram / Discord
          - recap            # annonces analysées ces dernières 24 h, envoyées sur Telegram

permissions:
  contents: write

concurrency:
  group: dealsniper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ inputs.mode || 'run' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Deal Sniper (${{ env.MODE }})
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IMAP_SERVER: ${{ secrets.IMAP_SERVER }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_EMAIL: ${{ secrets.IMAP_EMAIL }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          case "$MODE" in
            run)     python -m dealsniper run ;;
            dry-run) python -m dealsniper -v run --dry-run ;;
            *)       python -m dealsniper "$MODE" ;;
          esac

      - name: Sauvegarder l'état (data/)
        if: env.MODE == 'run'
        run: |
          git config user.name  "dealsniper-bot"
          git config user.email "dealsniper-bot@users.noreply.github.com"
          git add data/seen_ads.json data/deals.json data/runs.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "chore(data): mise à jour de l'état [skip ci]"
            git pull --rebase --autostash
            git push
          fi

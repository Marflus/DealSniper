<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Deal Sniper">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset=".5" stop-color="#ff3d7f"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a4e"/>
      <stop offset="1" stop-color="#8b3dff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#3b0764" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- Fond arrondi dégradé -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <circle cx="14" cy="12" r="22" fill="#fff" opacity=".12"/>

  <!-- Étiquette de prix, trou = viseur -->
  <g transform="rotate(-32 32 34)" filter="url(#shadow)">
    <path d="M11 34 L21 22 H52 V46 H21 Z" fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="22" cy="34" r="4.6" fill="none" stroke="url(#ink)" stroke-width="2.2"/>
    <path d="M22 27.5 V30 M22 38 V40.5 M15.5 34 H18 M26 34 H28.5" stroke="url(#ink)" stroke-width="2.2" stroke-linecap="round"/>
    <text x="40.5" y="41" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900"
          font-size="19" fill="url(#ink)">€</text>
  </g>

  <!-- Étincelle « bonne affaire » -->
  <path d="M50 6 C51 11 52 12 57 13 C52 14 51 15 50 20 C49 15 48 14 43 13 C48 12 49 11 50 6 Z" fill="#ffe14d"/>
  <circle cx="57" cy="22" r="1.8" fill="#ffe14d"/>
</svg>

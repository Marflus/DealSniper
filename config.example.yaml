# =============================================================================
#  Deal Sniper — configuration d'exemple
#  Au premier lancement, ce fichier est copié en config.yaml : c'est CE fichier-là (ignoré par git)
#  que l'interface et vous modifiez. Celui-ci sert de référence et peut être mis à jour sans conflit.
#  Les mots-clés sont insensibles à la casse et aux accents ("oxydé" = "OXYDE"),
#  cherchés en mots entiers ("hs" ne trouve pas "hstore").
# =============================================================================

# -----------------------------------------------------------------------------
#  Recherches communes : lancées sur TOUS les sites activés (base commune).
#  condition (parts = pour pièces / HS, used = occasion, any = tout) ne sert qu'à eBay ;
#  sur les autres sites, deux recherches identiques sont fusionnées (prix max le plus haut).
# -----------------------------------------------------------------------------
#  Pourquoi ces objets : très demandés, pannes connues et simples (ThinkPad / Latitude / EliteBook :
#  SSD, RAM, batterie, charnière ; MacBook : batterie, clavier ; ThinkCentre : mini-PC vendus sans disque ;
#  Dyson : batterie ; Sonos / Bose : alimentation, batterie ; outils vendus sans batterie).
#  Ordre alphabétique (l'interface les trie de la même façon).
searches:
  - {query: "bose", condition: parts, max_price: 80}
  - {query: "dell latitude", condition: parts, max_price: 100}
  - {query: "dewalt machine nue", condition: any, max_price: 80}
  - {query: "dyson", condition: parts, max_price: 80}
  - {query: "hp elitebook", condition: parts, max_price: 100}
  - {query: "macbook", condition: parts, max_price: 200}
  - {query: "makita sans batterie", condition: any, max_price: 80}
  - {query: "sonos", condition: parts, max_price: 80}
  - {query: "surface pro", condition: parts, max_price: 120}
  - {query: "thinkcentre", condition: any, max_price: 90}
  - {query: "thinkpad", condition: parts, max_price: 130}

# -----------------------------------------------------------------------------
#  Sites surveillés : un bloc par fichier de dealsniper/sites/
#  interval : pause (secondes, tirée au hasard) entre deux passages en mode `watch`
#  searches : recherches EN PLUS des recherches communes ; common_searches: false pour les ignorer
#  fetch_details: false : ne lit pas la fiche de chaque annonce retenue (plus rapide, moins de requêtes)
# -----------------------------------------------------------------------------
sites:
  # API officielle eBay (secrets EBAY_CLIENT_ID / EBAY_CLIENT_SECRET), objets situés en France.
  #   condition : parts (pour pièces), used (occasion), any (tout) ; max_price en euros
  #   eBay comprend « (a,b) » = a OU b : « thinkpad (t480,t490) »
  ebay:
    enabled: true
    interval: [600, 900]       # 13 recherches toutes les 10-15 min ≈ 1 500 appels/jour (quota : 5 000)
    marketplace: EBAY_FR
    country: FR
    limit: 100                 # annonces récentes par recherche, par pages de 200 (jusqu'à 500 ; attention au quota)
    searches:
      - {query: "thinkpad (t480,t490,t14,x280,x390)", condition: used, max_price: 170}
      - {query: "macbook air m1", condition: used, max_price: 380}

  vinted:
    enabled: true
    interval: [900, 1500]      # recherches communes : passages plus espacés pour rester discret
    limit: 25
    searches: []

  leboncoin:
    enabled: true
    headless: false
    interval: [900, 1500]
    limit: 25
    searches:
      # Catégories LBC : 15=Informatique, 16=Image&Son, 43=Consoles, 21=Bricolage
      - {query: "tv pas d'image", category: '16', max_price: 120}  # rétroéclairage : réparation simple, retrait sur place

  facebook:
    enabled: true
    interval: [900, 1500]
    city: "paris"      # ou ta ville
    limit: 20
    headless: false
    fetch_details: false       # n'ouvre pas une fenêtre par annonce (l'IA juge sur titre + prix)
    searches:
      - {query: "tv pas d'image", max_price: 120}

  # Vos propres sites : copiez dealsniper/sites/_template.py, puis ajoutez un bloc ici.
  # mon_site:
  #   enabled: true
  #   interval: [1800, 3600]
  #   list_url: "https://exemple.fr/annonces?tri=recent"

# -----------------------------------------------------------------------------
#  Réseau (commun à tous les sites)
# -----------------------------------------------------------------------------
network:
  user_agent: "DealSniper/3.0 (veille personnelle non commerciale)"  # identification honnête
  min_host_interval: 10        # secondes minimum entre deux requêtes vers un même site
  host_intervals:              # exceptions : l'API officielle eBay est limitée par quota, pas par rythme
    api.ebay.com: 1
  detail_delay: [0, 1]         # pause avant chaque lecture de fiche détaillée
  access_denied_pause_hours: 6 # un refus (401/403, robots.txt) met le site en pause

# -----------------------------------------------------------------------------
#  Localisation : uniquement les annonces situées en France
# -----------------------------------------------------------------------------
location:
  france_only: true           # rejette « Provenance : Chine », « Lieu : Allemagne », prix en £ / $…
  exclude_overseas: true      # rejette aussi les DOM-TOM (codes postaux 971-976, 986-989)
  home: ""                    # votre code postal ou ville (ex. "69003") : distance de chaque annonce

# -----------------------------------------------------------------------------
#  Pré-filtre (Python pur, 0 token)
# -----------------------------------------------------------------------------
filters:
  drop_uncategorized: true    # rejette les annonces qui ne correspondent à aucune catégorie
  keep_unknown_price: true    # garde les annonces dont le prix n'a pas pu être lu
  min_price: 5                # en dessous : souvent un faux prix (« 1 € à débattre »)

  # Annonces déjà vendues, réservées ou en cours d'achat : rejetées avant tout appel à l'IA.
  # Mots en DÉBUT ou FIN de titre (« PS5 - VENDUE », « RÉSERVÉ iPhone 12 », mais pas « vendu pour pièces »)
  # et phrases n'importe où dans la DESCRIPTION.
  sold_title_keywords: ["vendu", "reserve"]
  sold_phrases: ["deja vendu", "plus disponible", "n'est plus a vendre", "est reserve", "en cours de vente", "en cours d'achat", "vente en cours", "transaction en cours"]

  # Signaux « bonne affaire » (titre + description), valables pour toutes les catégories.
  # Ils aident à repérer les objets FONCTIONNELS vendus sous leur cote (revente directe) :
  # ces annonces sont priorisées et le signal est transmis à Claude.
  deal_signals:
    - "urgent"
    - "vente rapide"
    - "demenagement"
    - "cause depart"
    - "depart a l'etranger"
    - "succession"
    - "debarras"
    - "vide maison"
    - "doit partir"
    - "prix sacrifie"
    - "a saisir"
    - "jamais servi"
    - "neuf sous blister"
    - "sous garantie"
    - "avec facture"
    - "comme neuf"
    - "comme neuve"
    - "tres bon etat"

  # Marques recherchées (qualité reconnue, cote stable, vente rapide), cherchées dans le TITRE :
  # annonce priorisée, signalée à l'IA (facilité de vente et score revus à la hausse) et badge ⭐.
  # Sans cette clé, une liste par défaut est utilisée (Apple, ThinkPad, Dyson, Sonos, Makita…).
  # desirable_brands: ["apple", "thinkpad", "dyson", "sonos", "makita", "nintendo"]

  # Annonces d'acheteurs (cherchés dans le TITRE uniquement)
  buyer_ad_keywords:
    - "recherche"
    - "recherché"
    - "achete"
    - "j'achete"
    - "je cherche"
    - "rachat"
    - "cherche"

  # Pannes rédhibitoires / pièges, cherchés dans titre + description
  global_exclude_keywords:
    - "carte mere hs"
    - "carte mere morte"
    - "carte mere defectueuse"
    - "sans carte mere"
    - "pour pieces uniquement sans carte mere"
    - "oxyde"
    - "oxydation"
    - "tombe dans l'eau"
    - "degat des eaux"
    - "liquide renverse"
    - "bloque icloud"
    - "verrouille icloud"
    - "compte google bloque"
    - "frp"
    - "mot de passe bios"
    - "bios verrouille"
    - "bios bloque"
    - "computrace"
    - "blacklist"
    - "vole"
    - "ecran casse"            # retirez-le si vous changez des dalles
    - "ne s'allume pas du tout apres orage"
    - "boite vide"
    - "photo seulement"
    - "lot de pieces"
    # Accessoires vendus seuls
    - "coque seule"
    - "housse seule"
    - "boite seule"
    - "chargeur seul"
    - "manette seule"
    - "telecommande seule"
    - "pied seul"
    - "notice seule"

# -----------------------------------------------------------------------------
#  Catégories (la première dont un mot-clé est dans le titre l'emporte)
#    keywords         : reconnaissance de la catégorie
#    max_budget       : prix + livraison maximum (€)
#    min_price        : (optionnel) surcharge le min_price global
#    exclude_keywords : exclusions propres à la catégorie
#    include_keywords : « signaux » de panne simple → priorisés et transmis à Claude
#    require_include  : true = on n'envoie à Claude QUE les annonces avec un signal
#                       (panne simple OU bonne affaire)
#  Les budgets valent pour les deux types d'affaires : un appareil fonctionnel
#  sous sa cote doit aussi y rentrer (relevez-les si vous visez du haut de gamme).
# -----------------------------------------------------------------------------
categories:
  - name: "PC portables pros"
    keywords: ["thinkpad", "latitude", "elitebook", "probook", "zbook", "dell precision", "macbook pro", "macbook air", "dell xps", "surface pro", "surface laptop", "travelmate", "lifebook", "dynabook"]
    max_budget: 180
    exclude_keywords: ["coque seule", "clavier seul", "chargeur seul", "nappe seule"]
    include_keywords: ["sans disque", "sans ssd", "sans disque dur", "sans hdd", "sans os", "sans windows", "sans chargeur", "batterie hs", "batterie morte", "batterie a changer", "ecran a changer", "clavier hs", "charniere", "ne charge plus", "port usb-c", "dc jack"]
    require_include: false

  - name: "Mini-PC"
    keywords: ["mini pc", "mini-pc", "nuc", "thinkcentre", "m720q", "m920q", "m710q", "m75q", "tiny", "optiplex micro", "elitedesk mini", "prodesk mini", "mac mini"]
    max_budget: 120
    include_keywords: ["sans disque", "sans ssd", "sans ram", "sans memoire", "sans os", "sans alimentation", "sans chargeur"]

  - name: "PC portables grand public"
    keywords: ["pc portable", "ordinateur portable", "laptop", "ideapad", "vivobook", "zenbook", "aspire", "pavilion", "inspiron", "omen", "rog", "tuf gaming", "legion", "predator", "nitro", "chromebook"]
    max_budget: 150
    exclude_keywords: ["coque seule", "clavier seul", "chargeur seul"]
    include_keywords: ["sans disque", "sans ssd", "sans os", "sans windows", "sans chargeur", "batterie hs", "ecran a changer", "charniere", "ne charge plus", "lent", "a reinstaller"]

  - name: "Raspberry Pi & micro-ordinateurs"
    keywords: ["raspberry", "raspberry pi"]
    max_budget: 40
    exclude_keywords: ["boitier seul", "alimentation seule"]

  - name: "Écrans & TV"
    keywords: ["ecran", "moniteur", "tv", "televiseur", "television", "oled", "qled"]
    max_budget: 150
    exclude_keywords: ["dalle cassee", "dalle fissuree", "ecran fissure", "fissure", "impact", "pied seul", "telecommande seule"]
    include_keywords: ["retroeclairage", "backlight", "ecran noir avec son", "son mais pas d'image", "pas d'image", "led", "alimentation", "ne s'allume plus", "clignote"]

  - name: "Aspirateurs Dyson & robots"
    keywords: ["dyson", "roborock", "roomba"]
    max_budget: 90
    exclude_keywords: ["tete seule", "brosse seule", "chargeur seul", "batterie seule", "support seul", "accessoires seuls", "filtre seul"]
    include_keywords: ["batterie hs", "batterie morte", "ne charge plus", "s'arrete", "se coupe", "clignote", "pulse", "bouton", "filtre"]

  - name: "Enceintes & audio"
    keywords: ["sonos", "bose", "marshall", "jbl charge", "jbl boombox", "ultimate ears"]
    max_budget: 90
    exclude_keywords: ["support seul", "cable seul", "housse seule", "telecommande seule"]
    include_keywords: ["ne s'allume plus", "ne s'allume pas", "alimentation", "batterie hs", "ne charge plus", "bluetooth"]

  - name: "Outillage sans fil"
    keywords: ["makita", "dewalt", "milwaukee", "bosch pro", "hikoki", "metabo", "festool", "ryobi"]
    max_budget: 120
    exclude_keywords: ["batterie seule", "chargeur seul", "coffret vide"]
    include_keywords: ["sans batterie", "machine nue", "solo", "sans chargeur", "body only"]

# -----------------------------------------------------------------------------
#  Analyse IA (Anthropic)
# -----------------------------------------------------------------------------
analyzer:
  enabled: true               # false = mode sans IA : tri + estimation par la cote du marché, aucun appel Claude
  # claude-haiku-5-5 : 0,10 $ / 0,50 $ par million de tokens (10 fois moins que claude-haiku-4-5).
  # Effort « low » et réflexion désactivée automatiquement : la notation n'en a pas besoin.
  model: "claude-haiku-5-5"
  batch_size: 20              # annonces par appel API (le prompt système est payé une fois par lot)
  max_description_chars: 400  # description tronquée avant envoi à l'IA
  resale_haircut: 0.9         # prudence : revente estimée × 0,9, puis marge recalculée (1 = désactivé)
  auto_calibrate: true        # dès 3 achats revendus (onglet Achats), le rabot suit vos ventes réelles
  deep_model: "claude-sonnet-5-5"  # bouton « Analyse du marché » : modèle + recherche web (à la demande, ~qq centimes)
  # web_search_usd: 0.01           # prix d'une recherche web (facturée en plus des tokens), pour le coût affiché
  max_ads_per_run: null       # nombre maximum d'annonces envoyées à l'IA par passage et par site (null = pas de limite)
  market_min_margin: 15       # écarte SANS IA une annonce dont la marge maximale selon la cote est sous ce montant (€)
  max_tokens: 4096            # plafond de la réponse (le lot est coupé en deux s'il est atteint)
  max_daily_cost_usd: 1.5     # sécurité anti-facture : ~1 000 annonces/jour avec haiku-4-5 (null = aucun plafond)
  max_retries: 4              # retries automatiques (429, 5xx, surcharge, réseau)
  timeout_seconds: 90
  structured_output: true     # réponse JSON garantie par schéma

# -----------------------------------------------------------------------------
#  Notifications
# -----------------------------------------------------------------------------
notifier:
  min_score: 8                # bonne affaire : un message Telegram par annonce
  watch_score: 6              # « à vérifier » (5-6/10) : regroupées dans un seul message par passage (null = désactivé)
  instant_min_score: 8        # message immédiat seulement au-dessus de cette note ; le reste part dans un récap groupé
  instant_min_margin: null    # et, si fixé, marge nette minimale (€) pour un message immédiat (null = pas de condition)
  # types d'affaires à notifier : reparation (objet en panne) / revente_directe (fonctionnel sous la cote)
  deal_types: ["reparation", "revente_directe"]
  min_margin: null            # marge nette minimale (€) pour être notifié (null = pas de minimum)
  min_ease: null              # facilité de réparation minimale (1-10) pour les objets à réparer (null = toutes)
  min_sale: null              # facilité de vente minimale (1-10) : demande sur le marché (null = toutes)

# -----------------------------------------------------------------------------
#  Stockage (data/dealsniper.db)
# -----------------------------------------------------------------------------
storage:
  seen_retention_days: 90     # durée de mémoire des annonces déjà vues

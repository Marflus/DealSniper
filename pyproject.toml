[project]
name = "dealsniper"
version = "2.0.0"
description = "Chasseur de bonnes affaires électroniques (à réparer ou sous la cote), France uniquement"
readme = "README.md"
requires-python = ">=3.10"
# Les dépendances sont listées dans requirements.txt (installées par la CI).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"dealsniper/analyzer.py" = ["E501"]   # le prompt système est un long texte
"tests/*" = ["E501"]
